name: Integration request
description: A technology Raion should support (a language, database, proxy…)
labels: [integration]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. The maintainer decides which integrations Raion includes (see GOVERNANCE.md). Your team can also add one to its own workspace: see docs/integrations/writing-integrations.md.
  - type: input
    id: technology
    attributes:
      label: Technology
      description: For example RabbitMQ, MongoDB, Java, Caddy
    validations:
      required: true
  - type: textarea
    id: signals
    attributes:
      label: What should be observed?
      description: The questions you want dashboards and alerts to answer, and which metrics, logs or traces you need.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: How you run it
      description: Versions, and whether it runs in Docker Compose or on a host.
  - type: textarea
    id: existing
    attributes:
      label: Existing exporters or OpenTelemetry instrumentation (optional)
      description: Links to upstream projects that already expose this technology's telemetry.
