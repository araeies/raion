name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - pnpm-lock.yaml
      - packages/core/src/runtime/images.ts
      - scripts/scan-images.mjs
      - .github/workflows/supply-chain.yml
  schedule:
    - cron: '0 6 * * 1' # weekly: new vulnerabilities are published for unchanged images too
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Generate the SBOM of Raion's npm dependencies
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  image-scan:
    name: Runtime image scan (report)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scan pinned runtime images with Trivy
        run: node scripts/scan-images.mjs
