# The example application's own Compose file. It knows nothing about observability:
# Raion's generated observability.override.yaml adds OpenTelemetry on top of it.
#
#   docker compose -f compose.yaml -f observability.override.yaml up -d --build
name: payments-demo

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  mem_limit: 256m
  restart: unless-stopped

services:
  payment-api:
    <<: *hardening
    build: .
    image: raion-example-payments:local
    environment:
      SERVICE_ROLE: payment-api
      LEDGER_URL: http://ledger-api:3000
      FAILURE_RATE: '0.01'
      SLOW_RATE: '0.02'
    ports:
      - 127.0.0.1:3000:3000

  ledger-api:
    <<: *hardening
    image: raion-example-payments:local
    environment:
      SERVICE_ROLE: ledger-api
      FAILURE_RATE: '0.005'

  # Synthetic traffic so there is something to look at. Not monitored by Raion.
  loadgen:
    <<: *hardening
    image: raion-example-payments:local
    command: [node, src/loadgen.js]
    environment:
      TARGET: http://payment-api:3000
      RPS: '5'
    depends_on: [payment-api]
